name: OpenTofu Apply

# Deploy infrastructure on push to main
on:
  push:
    branches: [main]
    paths:
      - 'infra/**'
      - '.github/workflows/tofu-apply.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: us-central1
  TOFU_VERSION: '1.8.7'

jobs:
  # ===========================================================================
  # Apply to Production
  # ===========================================================================
  apply-prod:
    name: OpenTofu Apply (Prod)
    runs-on: ubuntu-latest
    environment: prod

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to GCP (WIF)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: OpenTofu Init
        working-directory: infra
        run: tofu init

      - name: OpenTofu Plan
        working-directory: infra
        run: |
          echo "==================================================================="
          echo "OpenTofu Plan - Production"
          echo "==================================================================="
          tofu plan -var-file="envs/prod.tfvars" -out=tfplan

      - name: OpenTofu Apply
        working-directory: infra
        run: |
          echo "Applying production infrastructure..."
          tofu apply -auto-approve tfplan

      - name: Output Results
        working-directory: infra
        run: |
          echo "==================================================================="
          echo "Production deployment complete"
          echo "==================================================================="
          tofu output -json > prod-outputs.json
          cat prod-outputs.json

      - name: Upload Outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prod-outputs
          path: infra/prod-outputs.json
          retention-days: 90
